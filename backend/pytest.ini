[pytest]
testpaths = tests
# The app package lives next to this file; pytest does not add the rootdir to
# sys.path on its own.
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore::DeprecationWarning
markers =
    sandbox_container: needs the sandbox container running (make test-sandbox)
# The sandbox-isolation tests assert the one property that only exists with a
# real container boundary, so they cannot run in the default suite — and they are
# deselected rather than skipped on purpose. A skip is a line of dots nobody
# reads; a deselection has its own make target and shows up as a thing you have
# not run.
addopts = -m "not sandbox_container"
