apiVersion: v1
kind: Service
metadata:
  name: skill-studio-frontend
spec:
  selector:
    app.kubernetes.io/name: skill-studio
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skill-studio-frontend
spec:
  # Safe to scale, unlike the backend: this is nginx serving static files and
  # proxying /api. It holds no state at all.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: skill-studio
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: skill-studio
        app.kubernetes.io/component: frontend
    spec:
      securityContext:
        runAsNonRoot: true
        # 1001 matches the image's own `ARG WEB_UID=1001` and the ownership it
        # sets on the paths nginx writes to. A different uid here needs the image
        # rebuilt with a matching --build-arg, not just this line changed.
        runAsUser: 1001
        # Group 0, because that is the group the image's chown uses so that g+w
        # reaches the account whatever the uid turns out to be.
        runAsGroup: 0
        fsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: REPLACE-WITH-REGISTRY.example.com/skill-studio/frontend:REPLACE-WITH-TAG
          ports:
            - name: http
              # 5173, not 80: an unprivileged port, so the container needs no
              # NET_BIND_SERVICE capability. Kept the same as development so the
              # app's URL is identical in both, and one redirect URI registered
              # in Keycloak covers both.
              containerPort: 5173
          env:
            # Where nginx forwards /api/ — the backend Service, not localhost.
            - name: API_URL
              value: http://skill-studio-backend:8000
            # Written into /var/www/config.js at container start, not baked into
            # the bundle. That is the mechanism that lets one built image run in
            # any environment, and it means these values must match the backend's
            # ConfigMap: the browser authenticates against whatever is here, and
            # the API validates against whatever is there.
            - name: AUTH_MODE
              value: "keycloak"
            - name: API_BASE
              value: "/api"
            - name: KEYCLOAK_URL
              value: "https://REPLACE-WITH-KEYCLOAK/auth"
            - name: KEYCLOAK_REALM
              value: "tsmc"
            - name: KEYCLOAK_CLIENT_ID
              value: "ai4bi-public"
          # config.js rather than / for the probe: it is generated at start-up
          # from the environment above, so a 200 here means the entrypoint ran
          # and nginx is serving — where a 200 on / would only mean nginx is up,
          # and a page that loads to a blank screen because config.js 404s is
          # exactly the failure worth catching.
          readinessProbe:
            httpGet: { path: /config.js, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /config.js, port: http }
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            # `readOnlyRootFilesystem` is deliberately NOT set here, and it is
            # worth knowing why, because it looks like an omission next to the
            # backend.
            #
            # It is not part of the restricted Pod Security Standard — that asks
            # for runAsNonRoot, no privilege escalation, all capabilities
            # dropped and the default seccomp profile, all of which are above.
            #
            # This image writes to five paths at start-up (/var/www for the
            # generated config.js, /etc/nginx/conf.d for the rendered server
            # config, /var/cache/nginx, /var/log/nginx and /run/nginx.pid) and
            # its Dockerfile already hands each of them to the unprivileged
            # account. Making the root filesystem read-only means mounting an
            # emptyDir over each — and over /var/www that is actively wrong: the
            # emptyDir hides the built bundle the image ships there, and the site
            # serves nothing but config.js. Restoring it needs an initContainer
            # that copies the bundle out of the image first, which is real
            # machinery in exchange for a hardening step the platform is not
            # asking for.
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
