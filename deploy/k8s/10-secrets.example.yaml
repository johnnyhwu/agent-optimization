# The secrets, as an example to copy — never as a file to fill in and commit.
#
# `stringData` takes plain text and the API server does the base64 for you, which
# is the only reason this is readable. It is also why applying a filled-in copy
# of this file from a laptop is the wrong workflow: create the Secret from an
# Azure DevOps variable group in the release pipeline, or with
# `kubectl create secret generic ... --from-literal=...` from a machine that
# already holds the values.
#
# There are five real secrets in this system. Everything else in the backend's
# configuration is a setting, and lives in 20-backend-config.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: skill-studio-secrets
type: Opaque
stringData:
  # 1. The database password, and the two URLs that embed it.
  #
  # Two URLs because two drivers: the application is async (asyncpg) and Alembic
  # is not (psycopg). They must point at the same database and carry the same
  # password — a mismatch shows up as the migration Job succeeding and the
  # backend failing to authenticate, or the reverse.
  #
  # Percent-encode anything URL-reserved in the password (`@ : / ? # [ ] %`).
  # A password with an `@` in it silently splits the host part of the URL.
  POSTGRES_PASSWORD: "change-me"
  DATABASE_URL: "postgresql+asyncpg://agentopt:change-me@skill-studio-db:5432/agentopt"
  SYNC_DATABASE_URL: "postgresql+psycopg://agentopt:change-me@skill-studio-db:5432/agentopt"

  # 2. The key that encrypts every user's stored personal credentials.
  #
  # Losing it does not lock people out — it makes what they saved unreadable, and
  # there is no recovery. Rotating it has the same effect. Back it up somewhere
  # that is not this cluster.
  #
  # A Fernet key: `python -c "from cryptography.fernet import Fernet;
  # print(Fernet.generate_key().decode())"`. Leave it empty to switch the
  # credential half of the settings page off entirely.
  SETTINGS_SECRET_KEY: ""

  # 3. The API key for the OpenAI-compatible LLM endpoint (judge, diagnosis,
  #    synthesis and the optimizer all use it).
  LLM_API_KEY: ""

  # 4. Langfuse, if TRACE_IMPL=real.
  LANGFUSE_SECRET_KEY: ""
  LANGFUSE_PUBLIC_KEY: ""

  # 5. The shared key sent to the agent server, if it wants one. Optional and
  #    inert when blank — authentication is not part of the agent contract.
  AGENT_API_KEY: ""
---
# The internal CA bundle, as a Secret rather than a ConfigMap: it is not secret
# in the cryptographic sense, but it lives beside the other deployment inputs and
# is mounted the same way.
#
# ⚠️ SSL_CERT_FILE *replaces* the default trust store rather than adding to it.
# This file must therefore contain the public roots as well as the internal one,
# or every outbound HTTPS call to a public host starts failing. Copying a
# corporate Linux machine's own bundle gets both:
#
#     kubectl create secret generic skill-studio-ca \
#       --from-file=ca-bundle.crt=/etc/ssl/certs/ca-certificates.crt
#
# Creating this Secret is half the job: SSL_CERT_FILE is commented out in
# 20-backend-config.yaml and has to be uncommented in the same change, or the
# bundle is mounted and nothing reads it.
#
# If your internal services present publicly-trusted certificates, skip this
# Secret and leave that variable commented — the image's own trust store is then
# correct and an incomplete bundle here would only break things.
apiVersion: v1
kind: Secret
metadata:
  name: skill-studio-ca
type: Opaque
stringData:
  ca-bundle.crt: |
    -----BEGIN CERTIFICATE-----
    ... your internal root, followed by the public roots ...
    -----END CERTIFICATE-----
