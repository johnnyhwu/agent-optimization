# Shared definition of the three services. This file alone is not a complete
# environment — it deliberately carries nothing that differs between running
# locally and running deployed (published ports, source bind-mounts, reload).
#
#   docker compose up
#       picks up docker-compose.override.yml automatically -> development.
#       `./scripts/dev.sh`, `make up`, `make test`, `make seed` all take this path
#       and behave exactly as they always have.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#       the deployed form: built bundle behind nginx, no reload, nothing but the
#       nginx port published. `make prod-up`.
#
# The split exists because Compose *appends* list-valued keys like `ports` and
# `volumes` when files are layered — an overlay cannot take a published port back
# out. Keeping the development-only entries out of the base is what makes them
# absent in deployment rather than merely overridden.
services:
  db:
    image: postgres:16
    container_name: agentopt_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agentopt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentopt}
      POSTGRES_DB: ${POSTGRES_DB:-agentopt}
    volumes:
      - agentopt_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agentopt} -d ${POSTGRES_DB:-agentopt}"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
    image: agentopt_backend
    container_name: agentopt_backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Same URLs as before, with the Postgres host swapped from localhost to the
      # compose service name. Still overridable from the host environment.
      #
      # These embed the development credentials, so a deployment that changes
      # POSTGRES_PASSWORD has to set both of these to match — which is why
      # docker-compose.prod.yml marks them required rather than leaving this
      # default in place to fail at connect time.
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://agentopt:agentopt@db:5432/agentopt}
      SYNC_DATABASE_URL: ${SYNC_DATABASE_URL:-postgresql+psycopg://agentopt:agentopt@db:5432/agentopt}

      # --- Identity (§6.16) ---
      # fake trusts an X-User-Subject header, which is what the seeded demo and
      # the owner/viewer switch in the top bar run on. keycloak verifies a real
      # bearer token.
      #
      # This lives in the base rather than only in docker-compose.prod.yml so
      # that `AUTH_MODE=keycloak ./scripts/dev.sh` works: pointing the
      # development stack at the real identity provider — with reload and HMR
      # still running — is how you shake out a Keycloak configuration before
      # putting nginx and a production build underneath it.
      AUTH_MODE: ${AUTH_MODE:-fake}
      FAKE_USER_SUBJECT: ${FAKE_USER_SUBJECT:-alice}
      KEYCLOAK_URL: ${KEYCLOAK_URL:-}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-tsmc}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-ai4bi-public}
      # `-` not `:-`: an explicitly empty value must survive, because blank is
      # how the audience check is switched off.
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE-ai4bi-public}
      # Employee directory behind the share picker.
      HR_API_BASE_URL: ${HR_API_BASE_URL:-https://cpochatproxyservice.cpoap-dev.dev.tsmc.com/proxy/employees}
      HR_API_VERIFY_SSL: ${HR_API_VERIFY_SSL:-false}
      HR_API_TIMEOUT_S: ${HR_API_TIMEOUT_S:-5}
      # CORS origin of the Vite dev server, as seen by the browser. Inert in the
      # deployed form, where nginx puts both halves on one origin.
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}

      # --- Trusting an internal certificate authority -------------------------
      # Internal services (Keycloak, Langfuse, the agent server, the employee
      # directory) present certificates signed by a private CA that the
      # python:3.12-slim base image has never heard of, so every outbound HTTPS
      # call fails with CERTIFICATE_VERIFY_FAILED / "unable to get local issuer
      # certificate" until it is told where to look.
      #
      # httpx reads this variable when `verify=True` (its default, and what all
      # six seams use), so one value covers Keycloak, Langfuse, the agent server
      # and the OpenAI-compatible LLM endpoint at once — no per-client setting.
      #
      # ⚠️ The file *replaces* the default trust store rather than adding to it,
      # so it must also contain the public roots. Copying the host's own bundle
      # (/etc/ssl/certs/ca-certificates.crt on a corporate Linux machine) gets
      # both; a bare corporate root on its own would break public HTTPS.
      #
      # Put the PEM at backend/certs/ca-bundle.crt — gitignored, and already
      # inside the container at /app/certs in both forms.
      SSL_CERT_FILE: ${SSL_CERT_FILE:-}

      # --- Integration selection (§9.2, §10.2). Default fake = the seeded demo. ---
      AGENT_IMPL: ${AGENT_IMPL:-fake}
      JUDGE_IMPL: ${JUDGE_IMPL:-fake}
      TRACE_IMPL: ${TRACE_IMPL:-fake}
      DIAGNOSIS_IMPL: ${DIAGNOSIS_IMPL:-fake}
      # Drafts an expected reasoning process from a trace, on the shortlist's
      # button. Shares the LLM endpoint with the judge and the diagnosis.
      SYNTHESIS_IMPL: ${SYNTHESIS_IMPL:-fake}
      # The playground's view of the agent's config + skills; reads
      # {AGENT_BASE_URL}/get_workspace.
      WORKSPACE_IMPL: ${WORKSPACE_IMPL:-fake}
      # The model that turns scored rollouts into skill edits. Its own seam, and
      # it was the one seam missing from this list: `OPTIMIZER_IMPL=real` set on
      # the host never reached the container, so an operator who had switched it
      # on still got canned edits with nothing anywhere saying why.
      OPTIMIZER_IMPL: ${OPTIMIZER_IMPL:-fake}

      # --- Real integrations. Credentials come from the host environment or a
      # repo-root .env; they are never baked into the image. ---
      # These are the *defaults* the "Run eval" dialog prefills from; each run
      # stores the settings it was actually triggered with. Values mirror
      # app/config.py so an unset variable here doesn't blank out its default.
      AGENT_BASE_URL: ${AGENT_BASE_URL:-}
      AGENT_TIMEOUT_S: ${AGENT_TIMEOUT_S:-120}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://litellm-ai4bi.cpoap-dev.dev.tsmc.com}
      LLM_API_KEY: ${LLM_API_KEY:-}
      JUDGE_MODEL: ${JUDGE_MODEL:-Qwen3.6-27B}
      DIAGNOSIS_MODEL: ${DIAGNOSIS_MODEL:-Qwen3.6-27B}
      SYNTHESIS_MODEL: ${SYNTHESIS_MODEL:-Qwen3.6-27B}
      # Separate from the other three on purpose: this is the call that reasons
      # about a whole minibatch of traces at once, so it is the one people point
      # at a stronger model. `OPTIMIZER_IMPL=real` refuses to start without it.
      OPTIMIZER_MODEL: ${OPTIMIZER_MODEL:-Qwen3.6-27B}
      JUDGE_SCORE_THRESHOLD: ${JUDGE_SCORE_THRESHOLD:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-http://langfuse-ai4bi.cpoap-dev.dev.tsmc.com}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_TIMEOUT_S: ${LANGFUSE_TIMEOUT_S:-60}
      RUN_CONCURRENCY: ${RUN_CONCURRENCY:-1}
      # Langfuse ingests a trace incrementally, so the read that first returns
      # observations can catch it still filling up — and the span that loses
      # that race is the last one, the final answer generation. These size the
      # window the read is repeated over; 0 reads trusts the first read (§6.12a).
      TRACE_SETTLE_DELAY_S: ${TRACE_SETTLE_DELAY_S:-1.0}
      TRACE_SETTLE_MAX_READS: ${TRACE_SETTLE_MAX_READS:-3}
      # Playground attempts are held in memory (§10.3), so this caps how many
      # each user keeps before the oldest finished ones are dropped.
      PLAYGROUND_MAX_ATTEMPTS_PER_USER: ${PLAYGROUND_MAX_ATTEMPTS_PER_USER:-20}
      # --- Optimization runs: what the "Run eval" wizard prefills ------------
      # Each is a *default*, not a ceiling: the wizard shows these and the run
      # stores whatever it was actually started with, so changing one here moves
      # the starting point for new runs and leaves existing ones alone. They are
      # listed because a deployment's answer to "how big is a step against this
      # agent" belongs to the deployment — a site whose agent server takes four
      # questions at a time should not retype the same numbers into every run.
      # app/config.py holds the same defaults, so an unset variable here does not
      # blank one out.
      OPTIMIZER_NUM_EPOCHS: ${OPTIMIZER_NUM_EPOCHS:-1}
      OPTIMIZER_BATCH_SIZE: ${OPTIMIZER_BATCH_SIZE:-8}
      # How many trajectories one analyst call may carry — independent of
      # OPTIMIZER_BATCH_SIZE, and the setting that decides whether that call fits
      # in the optimizer model's context window at all.
      OPTIMIZER_MINIBATCH_SIZE: ${OPTIMIZER_MINIBATCH_SIZE:-8}
      OPTIMIZER_LEARNING_RATE: ${OPTIMIZER_LEARNING_RATE:-8}
      OPTIMIZER_MIN_LEARNING_RATE: ${OPTIMIZER_MIN_LEARNING_RATE:-2}
      OPTIMIZER_ANALYST_WORKERS: ${OPTIMIZER_ANALYST_WORKERS:-4}
      OPTIMIZER_MERGE_BATCH_SIZE: ${OPTIMIZER_MERGE_BATCH_SIZE:-8}
      # The shape choices rather than the sizes; most deployments never move
      # them. See app/optimizer/hyperparams.py for what each one selects.
      OPTIMIZER_SCHEDULER: ${OPTIMIZER_SCHEDULER:-constant}
      OPTIMIZER_GATE_METRIC: ${OPTIMIZER_GATE_METRIC:-hard}
      OPTIMIZER_MIXED_WEIGHT: ${OPTIMIZER_MIXED_WEIGHT:-0.5}
      OPTIMIZER_FAILURE_ONLY: ${OPTIMIZER_FAILURE_ONLY:-false}
      OPTIMIZER_SLOW_UPDATE: ${OPTIMIZER_SLOW_UPDATE:-false}
      OPTIMIZER_META_SKILL: ${OPTIMIZER_META_SKILL:-false}

      # --- Early stopping: four conditions, one mechanism ---------------------
      # A *share* is what fraction of one split may fail before that split's
      # numbers are refused; a *streak* is how many times in a row that may
      # happen before the run stops. The pair belongs together — the share
      # decides what counts as a bad rollout, the streak decides how many bad
      # ones are a broken agent rather than a bad afternoon. Raise the shares on
      # an agent server that is known to drop the occasional question, rather
      # than watching runs stop on it. See app/optimizer/stopping.py.
      EARLY_STOP_TRAIN_ERROR_SHARE: ${EARLY_STOP_TRAIN_ERROR_SHARE:-0.25}
      EARLY_STOP_TRAIN_ERROR_STREAK: ${EARLY_STOP_TRAIN_ERROR_STREAK:-3}
      EARLY_STOP_VAL_ERROR_SHARE: ${EARLY_STOP_VAL_ERROR_SHARE:-0.25}
      EARLY_STOP_VAL_ERROR_STREAK: ${EARLY_STOP_VAL_ERROR_STREAK:-3}
      # Steps without a new best before the run stops; 0 is off.
      EARLY_STOP_PATIENCE: ${EARLY_STOP_PATIENCE:-0}
      # Stop as soon as validation reaches this. Blank is off — `-` not `:-`,
      # because an explicitly empty value has to survive to mean that.
      EARLY_STOP_TARGET_SCORE: ${EARLY_STOP_TARGET_SCORE-}

      # An eval set can be built by uploading a Python script that queries a
      # business database. Every number below is a containment boundary rather
      # than a preference — see app/services/script_runner.py for what each one
      # prevents — so they are overridable per deployment but none should be
      # raised without reading that file first.
      SCRIPT_MAX_ROWS_PER_QUERY: ${SCRIPT_MAX_ROWS_PER_QUERY:-50000}
      SCRIPT_STATEMENT_TIMEOUT_S: ${SCRIPT_STATEMENT_TIMEOUT_S:-600}
      # Raising this alone is not enough in the deployed form: nginx has to be
      # willing to hold the request open at least as long, or it answers 504
      # first — see proxy_read_timeout in frontend/nginx.conf.template.
      SCRIPT_WALL_CLOCK_S: ${SCRIPT_WALL_CLOCK_S:-600}
      SCRIPT_MAX_QUERIES: ${SCRIPT_MAX_QUERIES:-50}
      SCRIPT_MAX_OUTPUT_CHARS: ${SCRIPT_MAX_OUTPUT_CHARS:-262144}
      SCRIPT_MEMORY_MB: ${SCRIPT_MEMORY_MB:-1024}
      # There is one uvicorn worker; each run forks a process and holds a worker
      # thread for up to SCRIPT_WALL_CLOCK_S.
      SCRIPT_MAX_CONCURRENT_RUNS: ${SCRIPT_MAX_CONCURRENT_RUNS:-2}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status == 200 else 1)\""]
      interval: 3s
      timeout: 3s
      retries: 20

  frontend:
    build:
      context: ./frontend
    image: agentopt_frontend
    container_name: agentopt_frontend
    depends_on:
      - backend

volumes:
  agentopt_pgdata:
  agentopt_node_modules:
